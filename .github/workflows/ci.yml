name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt && pip install -e .
      - run: ruff check gbwind tests
      - name: Leakage tests
        run: pytest -q tests/test_template_leakage.py
      - name: Marginal invariance tests
        run: pytest -q tests/test_couplings.py
      - name: Everything else, including the synthetic end to end run
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t gbwind .
      - run: docker run --rm --entrypoint pytest gbwind -q tests/test_template_leakage.py tests/test_couplings.py

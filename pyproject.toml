[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gbwind"
version = "0.1.0"
description = "When do wind farms underproduce together? Dependence, not marginals, in AI and physics weather ensembles against GB metered generation."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["gbwind*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs live access to Elexon or dynamical.org (deselected in CI)"]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

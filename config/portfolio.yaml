# Candidate portfolio. Every BM unit ID below was checked against the Elexon
# reference (/reference/bmunits/all) and every REPD Ref ID against the Q2 2026
# REPD extract on 25 Sep 2026. All farms were operational by mid 2020, so the
# metered history behind the dependence template spans several years.
#
# Coordinates and tip height come from REPD, capacity from the BM unit
# reference. `python -m gbwind portfolio build` resolves them, and
# `python -m gbwind portfolio select` applies the metering reliability rule.
# Set hub_height_m on a farm to override the DESIGN.md approximation.

farms:
  # Offshore
  - id: beatrice
    name: Beatrice
    type: offshore
    repd_refs: [2521]
    bmunits: [T_BEATO-1, T_BEATO-2, T_BEATO-3, T_BEATO-4]
